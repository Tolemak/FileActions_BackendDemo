; Dev-container PHP config.
; Only settings that differ from PHP's compiled-in defaults are listed here —
; extension loading (imagick, xdebug, zip) is handled by the Dockerfile via
; docker-php-ext-enable / docker-php-ext-install, not here, to avoid loading
; anything twice.

[PHP]
memory_limit = 256M
; The app enforces a 5MB upload limit itself (see FileController) — PHP's
; own limit must be at least that or uploads get silently rejected before
; the app ever sees them.
upload_max_filesize = 6M
post_max_size = 8M
max_execution_time = 60

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

[xdebug]
xdebug.mode = develop,debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9000
