nav:
    tools: Tools

tools:
    resize: Resize
    convert: Convert
    compress: Compress
    rotate: Rotate
    sepia: Sepia

mat:
    label: Cutting mat

bar:
    formats: formats
    limit: limit
    file: file
    size: size
    dims: dimensions
    result: result

common:
    cancel: Cancel
    cancelled_title: Cancelled
    cancelled_text: The file was not processed.
    back_home: Back to the tools
    drop_label: "Drop an image here or <span class=\"filepond--label-action\">browse</span>"

home:
    title: File Actions
    heading: Image processing on the server
    lead: Upload a JPG, PNG or GIF up to 5 MB, pick a tool, and the server sends back the finished file.
    card:
        resize:
            text: Scale an image down or up by a percentage.
        convert:
            text: Save the image in another format.
        compress:
            text: Make the file lighter at the cost of quality.
        rotate:
            text: Turn the image by the angle you choose.
        sepia:
            text: Give a photo a warm, brown tone.

resize:
    title: Resize
    header: Resize an image
    description: Upload an image, then pick the new size as a percentage of the original (10–300%).
    button: Resize
    prompt_title: New size in % of the original

convert:
    title: Convert
    header: Change the image format
    description: Upload an image and choose the format the server should save it in.
    option_label: Target format
    button: Convert

compress:
    title: Compress
    header: Compress an image
    description: Upload an image and choose a compression level from 1 to 100. A higher level gives a smaller file and lower quality.
    button: Compress
    prompt_title: Compression level (1–100)

rotate:
    title: Rotate
    header: Rotate an image
    description: Upload an image and choose a rotation angle from 0 to 360 degrees.
    button: Rotate
    prompt_title: Rotation angle in degrees

sepia:
    title: Sepia filter
    header: Apply a sepia filter
    description: Upload an image and choose the sepia intensity from 1 to 100.
    button: Apply sepia
    prompt_title: Sepia intensity (1–100)

error:
    "404":
        header: No such page
        description: The address is wrong or the page has moved.
        text: Nothing is lying on the mat at this address.
        subtext: Pick a tool from the list at the top.
    generic:
        header: Something went wrong
        description: The server did not finish the request.
        text: An unexpected error occurred.
        subtext: Please try again in a moment.
    file_not_found: File not found
    invalid_file_type: File must be a JPEG, PNG or GIF
    file_too_large: File size must be less than 5MB
    image_too_large: Image dimensions are too large to process
    resize_invalid: Size must be between 10 and 300
    resize_failed: Could not resize the file. Please try again.
    convert_invalid: Extension must be jpeg, png or gif
    convert_failed: Could not convert the file. Please try again.
    compress_invalid: Compress ratio must be between 1 and 100
    compress_failed: Could not compress the file. Please try again.
    rotate_invalid: Degrees must be between 0 and 360
    rotate_failed: Could not rotate the file. Please try again.
    sepia_invalid: Intensity must be between 1 and 100
    sepia_failed: Could not apply the sepia filter. Please try again.

footer:
    source: Source on GitHub

js:
    network_error_title: Network error
    network_error_text: Could not reach the server. Please check your connection and try again.
