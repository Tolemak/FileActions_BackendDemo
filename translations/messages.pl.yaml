common:
    cancel: Anuluj
    cancelled_title: Anulowano
    cancelled_text: Plik nie został przetworzony.
    back_home: Wróć do narzędzi
    drop_label: "Upuść tu obraz albo <span class=\"filepond--label-action\">wybierz plik</span>"

home:
    title: File Actions
    heading: Obróbka obrazów na serwerze
    lead: Wgraj JPG, PNG albo GIF do 5 MB, wybierz narzędzie, a serwer odeśle gotowy plik.
    card:
        resize:
            text: Zmniejsz albo powiększ obraz procentowo.
        convert:
            text: Zapisz obraz w innym formacie.
        compress:
            text: Zmniejsz wagę pliku kosztem jakości.
        rotate:
            text: Obróć obraz o wybrany kąt.
        sepia:
            text: Nadaj zdjęciu ciepły, brązowy odcień.

resize:
    title: Zmiana rozmiaru
    header: Zmień rozmiar obrazu
    description: Wgraj obraz, a po kliknięciu przycisku wybierz nowy rozmiar w procentach oryginału (10–300%).
    button: Zmień rozmiar
    prompt_title: Nowy rozmiar w % oryginału

convert:
    title: Konwersja formatu
    header: Zmień format obrazu
    description: Wgraj obraz i wybierz format, w jakim serwer ma go zapisać.
    option_label: Format docelowy
    button: Konwertuj

compress:
    title: Kompresja
    header: Skompresuj obraz
    description: Wgraj obraz i wybierz poziom kompresji od 1 do 100. Wyższy poziom daje mniejszy plik i niższą jakość.
    button: Skompresuj
    prompt_title: Poziom kompresji (1–100)

rotate:
    title: Obrót
    header: Obróć obraz
    description: Wgraj obraz i wybierz kąt obrotu od 0 do 360 stopni.
    button: Obróć
    prompt_title: Kąt obrotu w stopniach

sepia:
    title: Filtr sepia
    header: Nałóż filtr sepia
    description: Wgraj obraz i wybierz intensywność sepii od 1 do 100.
    button: Nałóż sepię
    prompt_title: Intensywność sepii (1–100)

error:
    "404":
        header: Nie ma takiej strony
        description: Adres jest błędny albo strona została przeniesiona.
        text: Pod tym adresem nic nie leży na macie.
        subtext: Wybierz narzędzie z listy u góry.
    generic:
        header: Coś poszło nie tak
        description: Serwer nie dokończył żądania.
        text: Wystąpił nieoczekiwany błąd.
        subtext: Spróbuj ponownie za chwilę.
    file_not_found: Nie znaleziono pliku
    invalid_file_type: Plik musi być w formacie JPEG, PNG lub GIF
    file_too_large: Rozmiar pliku musi być mniejszy niż 5MB
    image_too_large: Obraz ma zbyt duże wymiary, aby go przetworzyć
    resize_invalid: Rozmiar musi być pomiędzy 10 a 300
    resize_failed: Nie udało się zmienić rozmiaru pliku. Spróbuj ponownie.
    convert_invalid: Format docelowy musi być jpeg, png lub gif
    convert_failed: Nie udało się przekonwertować pliku. Spróbuj ponownie.
    compress_invalid: Poziom kompresji musi być pomiędzy 1 a 100
    compress_failed: Nie udało się skompresować pliku. Spróbuj ponownie.
    rotate_invalid: Kąt obrotu musi być pomiędzy 0 a 360
    rotate_failed: Nie udało się obrócić pliku. Spróbuj ponownie.
    sepia_invalid: Intensywność musi być pomiędzy 1 a 100
    sepia_failed: Nie udało się nałożyć filtru sepia. Spróbuj ponownie.

footer:
    source: Kod na GitHubie

js:
    network_error_title: Błąd sieci
    network_error_text: Nie udało się połączyć z serwerem. Sprawdź połączenie i spróbuj ponownie.
