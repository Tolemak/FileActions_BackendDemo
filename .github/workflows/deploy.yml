name: Test and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick, zip, ctype, iconv
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          APP_ENV: test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - name: Verify frontend build
        run: npm run build

      - name: Deploy to Mikrus
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (verified 2026-09-08 directly against /etc/ssh/ssh_host_ed25519_key.pub on the server).
          echo '[konrad192.mikrus.xyz]:10192 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKISUA7JlS13WF3PQaRdtugdoIwiQWt7QrMuLEJ3wQxy' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 10192 root@konrad192.mikrus.xyz "file-actions"
